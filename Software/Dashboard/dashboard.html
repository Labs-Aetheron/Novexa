<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hexapod Rover Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    .card h2 {
      margin-top: 0;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }
    .legs-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .legs-table th, .legs-table td {
      text-align: center;
      padding: 6px;
      border-bottom: 1px solid #334155;
      font-size: 13px;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
    }
    .badge-stand {
      background: rgba(34,197,94,0.25);
      color: #4ade80;
    }
    .badge-rest {
      background: rgba(239,68,68,0.25);
      color: #fca5a5;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 10px;
      margin-top: 20px;
    }
    button {
      background: #0f172a;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #1e293b;
    }
    #bot-figure {
      width: 100%;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ultra-item {
      margin-top: 10px;
    }
    .bar {
      background: #334155;
      height: 6px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.25s linear;
    }
    .far { background: #22c55e; }
    .near { background: #eab308; }
    .very-near { background: #ef4444; }
    .tag {
      padding: 3px 6px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 11px;
    }
    #status-message {
      margin-top: 8px;
      text-align: right;
      font-size: 12px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

<h1>Hexapod Rover Dashboard</h1>

<div class="grid">
  <!-- LEFT SIDE -->
  <div class="card">
    <h2>Rover Pose & Controls</h2>

    <div id="bot-figure">
      <svg id="bot-svg" viewBox="0 0 200 200">
        <!-- Body -->
        <rect x="70" y="70" width="60" height="60" rx="10"
              stroke="#64748b" stroke-width="2" fill="none"></rect>

        <!-- Leg lines -->
        <line id="leg1" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
        <line id="leg2" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
        <line id="leg3" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
        <line id="leg4" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
        <line id="leg5" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
        <line id="leg6" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div></div>
      <button data-cmd="forward">Forward</button>
      <div></div>

      <button data-cmd="left">Left</button>
      <button data-cmd="stop">Stop</button>
      <button data-cmd="right">Right</button>

      <button data-cmd="rotate_left">Rotate ⟲</button>
      <button data-cmd="backward">Backward</button>
      <button data-cmd="rotate_right">Rotate ⟳</button>

      <button data-cmd="up">Up</button>
      <div></div>
      <button data-cmd="down">Down</button>
    </div>

    <div id="status-message">Status: Connecting…</div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="card">
    <h2>Servo Angles & Ultrasonic</h2>

    <table class="legs-table">
      <thead>
        <tr>
          <th>Leg</th>
          <th>Coxa</th>
          <th>Femur</th>
          <th>Tibia</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="legs-body"></tbody>
    </table>

    <div style="margin-top:10px;">
      Pose: <span id="pose-status" class="tag">Unknown</span>
      <span style="float:right;">Last Update: <span id="last-update" class="tag">–</span></span>
    </div>

    <h3 style="margin-top:20px;">Ultrasonic Sensors</h3>

    <div class="ultra-item">
      <div>Left — <span id="left-label" class="tag">–</span></div>
      <div>Distance: <span id="left-distance">–</span> m</div>
      <div class="bar"><div id="left-bar" class="bar-fill far"></div></div>
    </div>

    <div class="ultra-item">
      <div>Right — <span id="right-label" class="tag">–</span></div>
      <div>Distance: <span id="right-distance">–</span> m</div>
      <div class="bar"><div id="right-bar" class="bar-fill far"></div></div>
    </div>

  </div>
</div>

<script>
/* ================================
     CHANGE TO YOUR ROBOT IP
================================ */
const ROBOT_IP = "http://192.168.1.50";
/* ================================ */

const statusMessageEl = document.getElementById("status-message");
const legsBodyEl = document.getElementById("legs-body");
const poseStatusEl = document.getElementById("pose-status");
const lastUpdateEl = document.getElementById("last-update");

const leftLabelEl = document.getElementById("left-label");
const leftDistanceEl = document.getElementById("left-distance");
const leftBarEl = document.getElementById("left-bar");

const rightLabelEl = document.getElementById("right-label");
const rightDistanceEl = document.getElementById("right-distance");
const rightBarEl = document.getElementById("right-bar");

const legLines = {
  1: document.getElementById("leg1"),
  2: document.getElementById("leg2"),
  3: document.getElementById("leg3"),
  4: document.getElementById("leg4"),
  5: document.getElementById("leg5"),
  6: document.getElementById("leg6"),
};

// Button actions
document.querySelectorAll("button[data-cmd]").forEach(btn => {
  btn.onclick = () => sendCommand(btn.dataset.cmd);
});

async function sendCommand(cmd) {
  try {
    statusMessageEl.textContent = `Sending: ${cmd}`;
    let r = await fetch(`${ROBOT_IP}/command`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({action: cmd})
    });
    if (!r.ok) throw 0;
    statusMessageEl.textContent = `Command sent: ${cmd}`;
  } catch {
    statusMessageEl.textContent = "Failed to send command.";
  }
}

function renderLegs(legs) {
  legsBodyEl.innerHTML = "";
  legs.forEach((l, idx) => {
    legsBodyEl.innerHTML += `
      <tr>
        <td>${idx+1}</td>
        <td>${l.coxa}</td>
        <td>${l.femur}</td>
        <td>${l.tibia}</td>
        <td><span class="badge ${l.standing?'badge-stand':'badge-rest'}">
          ${l.standing ? "Standing" : "Rest"}
        </span></td>
      </tr>`;
  });
}

function updateFigure(legs) {
  const cx=100, cy=100, len=35;
  legs.forEach((l,i)=>{
    const line = legLines[i+1];
    const ang = (l.coxa-90)*Math.PI/180;
    const x2 = cx + len*Math.cos(ang);
    const y2 = cy + len*Math.sin(ang);
    line.setAttribute("x1",cx); line.setAttribute("y1",cy);
    line.setAttribute("x2",x2); line.setAttribute("y2",y2);
  });
}

function updateUltrasonic(U) {
  if (!U) return;

  // LEFT
  leftDistanceEl.textContent = U.left.distance_m.toFixed(2);
  leftLabelEl.textContent = U.left.label;

  let p1 = Math.max(0, Math.min(2, U.left.distance_m));
  let fill1 = (1 - p1/2) * 100;
  leftBarEl.style.width = fill1 + "%";
  leftBarEl.className = "bar-fill " +
    (U.left.distance_m < 0.3 ? "very-near" :
     U.left.distance_m < 1.0 ? "near" : "far");

  // RIGHT
  rightDistanceEl.textContent = U.right.distance_m.toFixed(2);
  rightLabelEl.textContent = U.right.label;

  let p2 = Math.max(0, Math.min(2, U.right.distance_m));
  let fill2 = (1 - p2/2) * 100;
  rightBarEl.style.width = fill2 + "%";
  rightBarEl.className = "bar-fill " +
    (U.right.distance_m < 0.3 ? "very-near" :
     U.right.distance_m < 1.0 ? "near" : "far");
}

async function fetchStatus() {
  try {
    let r = await fetch(`${ROBOT_IP}/status`, {cache:"no-store"});
    if (!r.ok) throw 0;
    let data = await r.json();

    renderLegs(data.legs);
    updateFigure(data.legs);
    updateUltrasonic(data.ultrasonic);

    poseStatusEl.textContent = data.pose.isStanding ? "Standing" : "Not Standing";

    lastUpdateEl.textContent = new Date().toLocaleTimeString();
    statusMessageEl.textContent = "Connected";
  } catch {
    statusMessageEl.textContent = "Error fetching status";
  }
}

setInterval(fetchStatus, 200);
fetchStatus();
</script>

</body>
</html>
